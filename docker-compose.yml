services:
  dev:
    image: ${APP_NAME}:local
    build:
      context: .
      args:
        APP_NAME: ${APP_NAME}
        APP_VERSION: ${APP_VERSION}
        BUILD_OS_ARCH_LIST: ${BUILD_OS_ARCH_LIST}
    command: hot-reload
    volumes:
      - ./:/usr/local/go/src/github.com/sol-strategies/${APP_NAME}
