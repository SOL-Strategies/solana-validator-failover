validator:
  bin: ./scripts/fdctl-mock.sh
  client:
    family: firedancer
  cluster: integration
  cluster_rpc_url: http://localhost:8899
  name: london
  public_ip: 10.0.0.2
  identities:
    active: ./integration/test-keys/active-identity.json
    passive: ./integration/test-keys/validator-2-passive.json
  rpc_address: http://localhost:8899?validator=london
  ledger_dir: ./integration/test-ledgers/london
  vote_history:
    # Defaults to ledger_dir; Firedancer must configure the same export directory.
  average_slot_duration: 400ms
  failover:
    consensus:
      mode: alpenglow
    tls:
      enabled: true
      ca_cert: ./integration/test-tls/ca.crt
      cert: ./integration/test-tls/node.crt
      key: ./integration/test-tls/node.key
    set_identity_active_cmd_template: "{{ .Bin }} set-identity --config /home/solana/config.toml {{ .Identities.Active.KeyFile }}{{ if .VoteHistoryWillBeTransferred }} --vote-history-file {{ .VoteHistoryImportFile }}{{ end }}"
    set_identity_passive_cmd_template: "{{ .Bin }} set-identity --config /home/solana/config.toml {{ .Identities.Passive.KeyFile }}"
    server:
      port: 9898
    peers:
      chicago:
        address: localhost:9897
    monitor:
      credit_samples:
        count: 2
        interval: 1s
    rollback:
      enabled: true
      to_passive:
        hooks:
          post:
            - name: rollback-done
              command: echo
              args: ["[london] rollback to passive complete"]
