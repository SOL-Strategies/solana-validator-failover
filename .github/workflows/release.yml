name: CI and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Includes the crypto/x509 mitigation for CVE-2026-111943.
  GOTOOLCHAIN: go1.27.3

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detection
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Select artifact version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=dev
          fi
          printf 'APP_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Smoke-test binary version and compiler
        run: |
          make smoke-test
          go version -m bin/.smoke/solana-validator-failover
      - name: Build release archives and checksums
        run: make build-all
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            bin/*.gz
            bin/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: bin
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            bin/*.gz
            bin/*.sha256
